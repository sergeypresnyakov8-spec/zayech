<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sberGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="warmAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#sberGreen)"/>
  <!-- Baby Stroller / Family Coin Emblem -->
  <circle cx="256" cy="200" r="80" fill="#ffffff" opacity="0.95"/>
  <!-- ₽ Symbol -->
  <text x="256" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="900" fill="#15803d" text-anchor="middle">₽</text>
  <!-- Two parent dots / hearts -->
  <circle cx="170" cy="360" r="44" fill="#60a5fa"/>
  <circle cx="342" cy="360" r="44" fill="#f472b6"/>
  <!-- Child center -->
  <circle cx="256" cy="380" r="32" fill="#fbbf24"/>
  <!-- Connection bridge / balance smile -->
  <path d="M170 360 Q256 420 342 360" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none"/>
</svg>
